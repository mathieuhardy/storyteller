name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build
        run: cargo build --release --locked -p storyteller-tauri

      - name: Package
        run: |
          NAME="storyteller-x86_64-linux"
          mkdir -p "dist/$NAME"
          cp target/release/storyteller-tauri "dist/$NAME/storyteller"
          cp storyteller-tauri/icons/128x128.png "dist/$NAME/icon.png"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          echo "sha256-$(openssl dgst -sha256 -binary "$NAME.tar.gz" | base64)" > "$NAME.tar.gz.sri"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            storyteller-x86_64-linux.tar.gz storyteller-x86_64-linux.tar.gz.sri \
            --title "$GITHUB_REF_NAME" --notes "Build de ${GITHUB_SHA}"
