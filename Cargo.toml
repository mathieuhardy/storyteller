[workspace]
members = ["storyteller-core", "storyteller-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/mhardy/storyteller"

[workspace.dependencies]
storyteller-core = { path = "storyteller-core" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps frontmatter key order end to end (see storyteller-core::model).
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
pulldown-cmark = "0.13"
unicode-normalization = "0.1"
walkdir = "2"
sha2 = "0.10"
# App-managed `created`/`updated` timestamps (RFC 3339). Formatting only.
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
